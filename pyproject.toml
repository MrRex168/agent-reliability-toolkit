[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-toolkit"
version = "1.0.0"
description = "Open-source toolkit for repeated AI agent evaluation, reliability testing, failure diagnosis, and regression detection."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MrRex168"}]
keywords = [
    "ai-agents",
    "agent-evaluation",
    "llm-evaluation",
    "agent-testing",
    "reliability",
    "regression-testing",
    "langchain",
    "langgraph",
    "mcp",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/MrRex168/agent-reliability-toolkit"
Repository = "https://github.com/MrRex168/agent-reliability-toolkit"
Documentation = "https://github.com/MrRex168/agent-reliability-toolkit#readme"
Issues = "https://github.com/MrRex168/agent-reliability-toolkit/issues"
Changelog = "https://github.com/MrRex168/agent-reliability-toolkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8.0", "Flask>=3.0"]
dashboard = ["Flask>=3.0"]
otel = ["opentelemetry-api>=1.37.0", "opentelemetry-sdk>=1.37.0"]

[project.scripts]
agent-reliability = "agent_reliability.cli:main"

[tool.setuptools.packages.find]
include = ["agent_reliability*"]
