[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-reliability-toolkit"
version = "0.7.0"
description = "Open-source toolkit for testing, evaluating and benchmarking AI agent reliability."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "MrRex168"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
otel = ["opentelemetry-api>=1.37.0", "opentelemetry-sdk>=1.37.0"]

[project.scripts]
agent-reliability = "agent_reliability.cli:main"

[tool.setuptools.packages.find]
include = ["agent_reliability*"]
